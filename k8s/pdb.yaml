# Keep at least one API pod up during voluntary disruptions (node drains, cluster upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: caas }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
