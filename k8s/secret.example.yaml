# Template only — never commit a real key. Not included in kustomization.yaml.
# scripts/k8s-local.sh creates the real Secret from your .env:
#   kubectl -n caas create secret generic caas-secrets --from-literal=ANTHROPIC_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: caas-secrets
  namespace: caas
type: Opaque
stringData:
  ANTHROPIC_API_KEY: sk-ant-replace-me
