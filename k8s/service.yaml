apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: caas }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: caas }
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - { name: http, port: 3000, targetPort: http }
