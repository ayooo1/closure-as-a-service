# Path-based routing: /api/* → Fastify, everything else → Next.js.
# Local: k3d's bundled Traefik. In the cloud, swap ingressClassName for your controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caas
  labels: { app.kubernetes.io/part-of: caas }
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
